schema_version: 1
id: entry_query_classifier
version: 0.1.0

meta:
  title: Entry query classification + query expansion
  owner: lib.agentic
  purpose: >
    Classify the user query into greeting/insult/unclear/need_rag, and generate either a direct answer
    or 1-3 expanded queries for retrieval.
  tags:
    - entry
    - classifier
    - query-expansion

inputs:
  - name: question
    type: string
    required: true
    description: The user's current question.
  - name: query_context
    type: array
    required: true
    description: Prior Q&A context (list of strings) for disambiguation and query expansion.

examples:
  - name: need_rag_example
    inputs:
      question: How can one become a better person
      query_context: []
    notes: The model should output query_type=need_rag and provide 1-3 concise expanded queries.

body:
  template: |-
    Analyze and classify the user query:

    User question: {question}

    User's prior Q&A history: {query_context}

    Classification rules:
    - **greeting**: Greeting or casual chat; generate a friendly reply as answer
    - **insult**: Inappropriate language; generate a professional and polite reply as answer
    - **unclear**: Vague or ambiguous question; generate a clarification request as answer
    - **need_rag**: Substantive question requiring retrieval; generate 1-3 expanded queries, answer can be empty

    Expanded query generation method (need_rag only):
    Infer user intent and provide more specific query questions, within 15 words each.
    If the question is incomplete, expand using content from query_context.
    Example:
    User question: How can one become a better person
    Expansion: ["What moral qualities should a person develop", "How to practice and cultivate them"]

    For the first three types, set expanded_queries to the original question.
    {cross_lang_section}

    Please use the classify_query tool for classification and query expansion.

cross_lang:
  template: |-
    IMPORTANT: The documents to be searched are in language "{doc_lang}" (e.g. en=English, zh=Chinese). The user question above may be in "{query_lang}". You must output all expanded_queries in "{doc_lang}" only, so they match the document language for retrieval.

tool_descriptions:
  expanded_queries: "Expanded queries for RAG search (1-3 queries, 15 chars max each)"
  expanded_queries_cross_lang_suffix: " Must be in {doc_lang} only (documents language), not in user's language."
