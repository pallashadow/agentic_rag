schema_version: 1
id: entry_query_classifier
version: 0.1.0

meta:
  title: Entry query classification + query expansion
  owner: lib.agentic
  purpose: >
    Classify the user query into greeting/insult/unclear/need_rag, and generate either a direct answer
    or 1-3 expanded queries for retrieval.
  tags:
    - entry
    - classifier
    - query-expansion

inputs:
  - name: question
    type: string
    required: true
    description: The user's current question.
  - name: query_context
    type: array
    required: true
    description: Prior Q&A context (list of strings) for disambiguation and query expansion.

examples:
  - name: need_rag_example
    inputs:
      question: 如何做好人
      query_context: []
    notes: The model should output query_type=need_rag and provide 1-3 concise expanded queries.

body:
  template: |-
    分析用户问题并分类：

    用户问题：{question}

    用户之前的问答记录：{query_context}

    分类规则：
    - **greeting**：问候语或闲聊，生成友好回复作为 answer
    - **insult**：不当言论，生成专业礼貌回应作为 answer
    - **unclear**：问题模糊不明确，生成请求澄清的回复作为 answer
    - **need_rag**：需要检索的实质性问题，生成 1-3 个扩展查询，answer 可为空

    扩展查询生成方法（仅用于 need_rag）：
    猜测用户的提问意图，并给出更具体的查询问句，15个字以内。
    如果question中内容不全，则参考query_context中的内容进行扩展。
    例如：
    用户提问：如何做好人
    扩展：["一个人应具备哪些道德品格", "如何加以实践与培养"]

    对于前三种类型，expanded_queries 设为原问题。
    {cross_lang_section}

    请使用 classify_query 工具进行分类和查询扩展。

cross_lang:
  template: |-
    重要：待检索文档的语言为「{doc_lang}」（en=英文，zh=中文），用户提问可能为「{query_lang}」。你必须仅使用「{doc_lang}」输出所有 expanded_queries，以便与文档语言一致。

tool_descriptions:
  expanded_queries: "RAG 检索用扩展查询（1-3 条，每条 15 字以内）"
  expanded_queries_cross_lang_suffix: " 必须全部使用「{doc_lang}」（文档语言），勿使用用户提问语言。"
