[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "chatbot-milesguo"
version = "0.1.0"
description = "Agentic RAG demo with FastAPI, LangGraph, and Elasticsearch."
authors = ["pannixilin"]
readme = "README.md"
packages = [{ include = "lib" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
elasticsearch = "9.2.1"
python-dotenv = "1.2.1"
uvicorn = "0.40.0"
fastapi = "0.128.0"
litellm = "1.80.11"
nest-asyncio = "1.6.0"
tqdm = "4.67.1"
langgraph = "1.0.5"
requests = "2.31.0"
pypdf = "4.0.1"
pyyaml = "6.0.2"
functions-framework = "^3.5.0"

[tool.poetry.group.dev.dependencies]
jupyter = "*"
openai = "*"
beautifulsoup4 = "*"
langchain-text-splitters = "*"
ipykernel = "^7.2.0"

[tool.poetry.group.test.dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
httpx = "0.25.2"

