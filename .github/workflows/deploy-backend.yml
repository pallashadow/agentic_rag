name: Deploy Backend with Unittest

on:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with test

      - name: Install project
        run: poetry install --no-interaction

      - name: Run pytest
        run: poetry run pytest test/ -v

  deploy-backend:
    name: Deploy Backend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud project
        run: gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

      - name: Create .env from GitHub secrets
        shell: bash
        run: |
          {
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}"
            echo "ELASTIC_URL=${{ secrets.ELASTIC_URL }}"
            echo "ELASTIC_API_KEY=${{ secrets.ELASTIC_API_KEY }}"
            echo "API_AUTH_TOKEN=${{ secrets.API_AUTH_TOKEN }}"
            echo "CORS_ALLOW_ORIGINS=${{ secrets.CORS_ALLOW_ORIGINS }}"
            echo "LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}"
            echo "LANGSMITH_TRACING=true"
            echo "LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT }}"
            echo "LANGSMITH_ENDPOINT=https://api.smith.langchain.com"
          } > .env

      - name: Deploy via deploy.sh
        shell: bash
        run: bash deploy/deploy.sh
